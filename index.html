<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1630; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #msg { position: fixed; left: 0; right: 0; bottom: 28px; padding: 0 24px; text-align: center; font: 14px/1.5 system-ui, sans-serif; color: rgba(255,255,255,.6); pointer-events: none; }
  #msg.strong { bottom: auto; top: 50%; transform: translateY(-50%); font-size: 16px; color: #fff; }
  #gear { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 5;
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(14,22,44,.6);
    color: #f3e3c3; font-size: 21px; line-height: 1; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #gear.show { opacity: 1; pointer-events: auto; }
  #panel { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 6;
    width: min(340px, calc(100% - 24px)); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow: auto; overscroll-behavior: contain; touch-action: pan-y; box-sizing: border-box; padding: 14px 16px 16px;
    background: rgba(17,22,36,.92); color: #f1ead8; border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #panel[hidden] { display: none; }
  #panel .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #panel h2 { font-size: 15px; margin: 0; font-weight: 650; }
  #panel h3 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: #e9b872; margin: 16px 0 4px; font-weight: 650; }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 5px 0; }
  #panel .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: #e9b872; }
  #panel .row.dim { opacity: .5; }
  #panel .val { font-variant-numeric: tabular-nums; color: #d6ccb6; }
  #panel .tag { color: #9d968a; font-size: 11px; margin-left: 4px; }
  #panel select { background: #232c45; color: inherit; border: 1px solid rgba(255,255,255,.22); border-radius: 6px; padding: 4px 6px; font: inherit; }
  #panel input[type=checkbox] { accent-color: #e9b872; width: 18px; height: 18px; margin: 0; }
  #panel .btn { background: #2b3554; color: inherit; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 11px; cursor: pointer; font: inherit; }
  #panel .btn.primary { background: #e9b872; color: #1d1a14; border-color: transparent; font-weight: 650; }
  #panel .btn.icon { padding: 3px 9px; font-size: 16px; }
  #panel .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  #panel .hint { color: #a9a294; font-size: 12px; margin: 6px 0 0; }
  #panel textarea { width: 100%; box-sizing: border-box; margin-top: 10px; height: 110px; background: #0e1322; color: #e8dfca; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; font: 12px ui-monospace, monospace; }
  #panel :focus-visible, #gear:focus-visible { outline: 2px solid #e9b872; outline-offset: 2px; }
  #panel { user-select: none; -webkit-user-select: none; }
  #panel.dragging { cursor: grabbing; }
  /* Holding a slider: hide the rest of the panel so the scene shows through */
  #panel.peek { background: transparent; border-color: transparent; box-shadow: none; }
  #panel.peek * { visibility: hidden; }
  #panel.peek .row.active, #panel.peek .row.active * { visibility: visible; }
  #panel.peek .row.active { background: rgba(17,22,36,.8); border-radius: 10px; padding: 4px 8px; margin: 0 -8px; }
  #panel .tabs, #panel .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  #panel .tabs { margin: 12px 0 2px; }
  #panel .seg { grid-column: 1 / -1; margin-top: 3px; }
  #panel .chip { flex: 1 1 auto; background: #232c45; color: #d9d0bd; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  #panel .chip.on { background: #e9b872; color: #1d1a14; border-color: transparent; font-weight: 650; }
  #panel .part { display: flex; align-items: center; gap: 8px; margin: 14px 0 2px; }
  #panel .part h3 { margin: 0; }
  #panel .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); flex: none; }
  #panel .hsl input[type=range] { -webkit-appearance: none; appearance: none; height: 14px; border-radius: 7px; margin: 4px 0 2px; background: var(--g); border: 1px solid rgba(255,255,255,.25); }
  #panel .hsl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #1b1f2c; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  #panel .hsl input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #1b1f2c; }
  #panel .hsl input[type=range]::-moz-range-track { background: transparent; }
  #stats { position: fixed; top: 8px; left: 10px; font: 12px ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.45); padding: 3px 7px; border-radius: 4px; display: none; pointer-events: none; }
</style>
</head>
<body>
<div id="msg"></div>
<div id="stats"></div>
<button id="gear" type="button" aria-label="Wallpaper settings" title="Settings">⚙</button>
<div id="panel" hidden></div>

<!-- Safety net: if Three.js can't load (e.g. PC just booted and the network isn't up yet), retry. -->
<script>
  window.__beachStarted = false;
  // Lively can call these before the 3D code has loaded, so they only store what they get.
  window.__lively = { track: undefined, trackAt: 0, audio: null, audioAt: 0, props: [], onProp: null };
  window.livelyCurrentTrack = function (d) {
    var L = window.__lively;
    try { L.track = typeof d === 'string' ? JSON.parse(d) : (d || null); } catch (e) { L.track = null; }
    L.trackAt = Date.now();
  };
  window.livelyAudioListener = function (a) { window.__lively.audio = a; window.__lively.audioAt = Date.now(); };
  window.livelyPropertyListener = function (name, val) {
    var L = window.__lively;
    if (L.onProp) L.onProp(name, val); else L.props.push([name, val]);
  };
  // Show script errors on screen instead of failing silently to a blank colour.
  window.addEventListener('error', function (e) {
    var m = document.getElementById('msg');
    if (m && e.message && !window.__beachNoted) { m.textContent = 'Something went wrong: ' + e.message; m.className = 'strong'; }
  });
  setTimeout(function () {
    if (!window.__beachStarted) {
      document.getElementById('msg').textContent = 'Waiting for network to load Three.js… retrying in 30s';
      setTimeout(function () { location.reload(); }, 30000);
    }
  }, 12000);
</script>

<script type="module">
// =====================================================================
//  SETTINGS
//
//  Two ways to change these:
//   1) Edit the values in this block and save. Lively reloads the wallpaper.
//   2) Use the on-screen panel: move the mouse into the top-right corner (on a phone, tap the
//      screen) and click the ⚙ gear. Panel changes are saved in that browser and override the
//      values below until you press "Reset to file values" in the panel. Its "Copy as code"
//      button gives you lines to paste here to make them permanent.
// =====================================================================

// ---- Calm vs. busy ---------------------------------------------------------------
const ACTIVITY_PRESET    = 'calm';      // 'lively' (original), 'calm', 'sleepy', or 'custom' (uses the 4 numbers below)
const MOVE_SPEED         = 0.6;         // custom: speed of breathing, leg swings, swaying and head turns. 1 = original
const ACTIVITY           = 0.4;         // custom: how often they glance, chat, yawn, wave and doze off. 1 = original, 0.1 = rarely
const IDLE_TIME          = 0.6;         // custom: share of the time they just rest and gaze ahead (0–1)
const BLINK_RATE         = 0.55;        // custom: how often they blink. 1 = original

// ---- Mouse --------------------------------------------------------------------------
const MOUSE_FOLLOW       = true;        // heads and eyes follow the cursor
const MOUSE_DEPTH        = 1;           // where the cursor "is": 0 = right among the characters (cursor above a head = look straight up),
                                        // 6 = out in front of them (they look forward at you)
const MOUSE_IDLE_SECONDS = 6;           // seconds without mouse movement before they go back to idle
const WAKE_ON_HOVER      = true;        // brushing the cursor across a sleeper's face wakes them up

// ---- Look ---------------------------------------------------------------------------
const DEPTH_BLUR         = 0.3;         // 0 = off. Blurs things more the further back they are (sea, clouds, island)
const BLUR_START         = 38;          // distance where the blur starts. The characters are about 15 away
const BLUR_FULL          = 120;         // distance where the blur reaches full strength
const SKY_BLUR           = 0.25;         // how much of that blur the sky, stars and far clouds get (0–1)
const WATER_BLUR         = 0.15;        // how much of that blur the sea gets (0–1). Low keeps distant waves crisp
const SATURATION         = 1.1;         // 1 = unchanged, 1.2 = more colourful, 0.8 = muted
const CONTRAST           = 1.0;         // 1 = unchanged
const WARMTH             = 0.15;         // -1 = cooler … +1 = warmer
const VIGNETTE           = 0.8;         // darkened corners, 0 = off
const CAMERA_ZOOM        = 0.7;         // above 1 zooms in, below 1 shows more
const CAMERA_HEIGHT      = 2.45;        // camera height. Lower feels more heroic, higher looks down on them
const CAMERA_DRIFT       = 0.5;         // gentle parallax: the camera shifts a little as the mouse moves across the screen. 0 = off

// ---- Phone (tall screens only: the Android app and phones in portrait) -----------------
// The camera fits itself around whichever characters are shown and keeps them centred.
const TALL_GROUP_POSITION = 0.6;        // how far down the screen the group sits (0.45 = middle … 0.75 = low)
const TALL_ZOOM          = 1.0;         // 1 = the characters just fit the width. Higher zooms in, lower shows more beach
const TALL_PAN           = 0;           // slide the view left (−) or right (+), in metres
const TALL_PALMS         = true;        // two palm trees framing the scene (you place them below)
const TALL_PALM_LEFT_X   = -0.5;        // left palm: metres out from the left-most character (− = further out, + = in behind them)
const TALL_PALM_LEFT_Z   = -1.6;        // left palm: depth (− = further back toward the sea, + = nearer the camera)
const TALL_PALM_RIGHT_X  = 0.4;         // right palm: metres out from the right-most character (+ = further out)
const TALL_PALM_RIGHT_Z  = -2.6;        // right palm: depth
const TALL_PALM_SIZE     = 1.0;         // palm height, 1 = normal
const TILT_PARALLAX      = 0;           // Android app: tilting the phone shifts the camera a little for a 3D feel. 0 = off (the app turns it on)
const PHONE_FPS          = 60;          // phone app / wallpaper frame rate, up to 120 (more = smoother, more battery)
const PHONE_RESOLUTION   = 1.5;         // phone render sharpness (pixels per screen point). Pixel 10 Pro XL screens are 3
const PHONE_BATTERY_SAVER = true;       // phone: drop to 15 fps when the battery is under 20% and not charging
const NIGHT_SKY_DARK     = 0;           // darker night sky, 0–1. Saves a little battery on OLED phone screens (the app uses 0.6)

// ---- Effects (each one 0 = off) -----------------------------------------------------
const COLOR_GRADE        = 'natural';   // colour-grade preset on top of the Look values: 'natural', 'film', 'golden', 'pastel', 'moody', 'vivid'
const BLOOM              = 0.5;         // soft glow around the fire, sun, moon and bright highlights
const SUN_RAYS           = 0.5;         // light shafts from the sun (or moon) when it is low in the sky
const CONTACT_SHADING    = 0.6;         // soft darkening where things touch: feet on sand, arms against bodies, rocks
const REFLECTIONS        = 0.6;         // the sky, islands, palms and sun reflected in the sea (and in wet sand when it rains)
const FIRELIGHT_ON_FACES = 1.0;         // warm firelight glow on the characters' faces and bodies at night
const WATER_SHINE        = 1.0;
const FILTER             = 'none';      // a look over the whole picture: 'none', 'dither', 'pixel', 'handheld', 'crt', 'comic', 'paint', 'film'
const FILTER_SIZE        = 3;           // size of the filter's pixels / dots / scanlines, in screen points
const FILTER_STRENGTH    = 1.0;         // 0–1: blend between the normal picture and the filter         // glittering path of sunlight or moonlight across the sea

// ---- Scene --------------------------------------------------------------------------
const OCEAN_SPEED        = 0.35;        // wave and swash speed. 1 = the original faster ocean
const CLOUD_SPEED        = 1.0;         // cloud drift speed. 0 = still
const CLOUD_AMOUNT       = 0.3;         // how much of the sky the wispy cloud streaks cover, 0–1
const FIRE_BRIGHTNESS    = 1.1;         // campfire light and glow strength
const SHOW_GULLS         = false;        // seagulls by day
const SHOW_SHOOTING_STARS = true;       // occasional shooting stars at night
const SHOW_ZZZ           = true;        // floating Zzz above whoever dozes off
const WIND               = 1.0;         // gusts that sway the palms, lean the fire and push the clouds. 0 = still air (live weather adds to this)
const SHOW_FIREFLIES     = true;        // fireflies drifting around on warm, dry nights
const GLOWING_WAVES      = true;        // blue glow where the waves break on dark nights
const SHOW_MARSHMALLOWS  = true;        // at night someone roasts marshmallows (and sometimes sets one on fire)
const CLICK_TO_INTERACT  = true;        // click a character (wave, hop, look at you) or the fire (puff of embers)
const NOW_PLAYING_SIGN   = true;        // Bo holds up a "now playing" sign with the song name (Lively only, see README)
const DANCE_TO_MUSIC     = true;        // they bob their heads and tap their feet while music plays
const CHARACTER_COUNT    = 4;           // 0–4. Each character has a hand-made pose, so 4 is the max.
                                        // Fewer keeps the most central ones: Bo (standing), Mo (rock, knee up),
                                        // Gil (rock, sitting), then Pip (cross-legged). Rocks stay as scenery.
const CHARACTER_FLAT_SHADING = false;   // true = faceted characters, false = smooth like the reference image

// ---- Character colours ----------------------------------------------------------------
// Three colour parts per character, each written as [hue 0–360, saturation 0–100, lightness 0–100]:
//   legs = legs, belly and feet      body = chest, arms and hands      head = head and snout
// (Pip's feet use his body colour, like in the reference picture.) Also editable in the ⚙ panel → Colours.
const CHARACTER_COLORS = {
  Pip: { legs: [84, 54, 61],  body: [223, 61, 39], head: [24, 77, 50] },    // cross-legged, far left
  Mo:  { legs: [352, 74, 37], body: [43, 3, 53],   head: [42, 76, 53] },    // on the rock, one knee up
  Bo:  { legs: [42, 86, 56],  body: [12, 74, 48],  head: [215, 54, 40] },   // standing
  Gil: { legs: [240, 2, 24],  body: [14, 76, 48],  head: [141, 66, 36] },   // sitting on the rock, far right
};

// ---- Weather and seasons --------------------------------------------------------------
const WEATHER_MODE       = 'live';      // 'live' = copy today's real weather at the place below (updates every 20 minutes)
                                        // or force one: 'clear', 'cloudy', 'rain', 'storm', 'fog', 'heat'
const WEATHER_PLACE      = 'Fresno';    // just a label for the ⚙ panel
const WEATHER_LAT        = 36.74;       // where the live weather comes from (Fresno, California)
const WEATHER_LON        = -119.79;
const WEATHER_STRENGTH   = 1.0;         // how strongly the weather shows, 0–1
const SEASONS            = true;        // day length, sun height, light and colours follow the time of year
const MOON_PHASES        = true;        // the moon shows tonight's real phase and rises and sets like the real one

// ---- Time of day --------------------------------------------------------------------
const CYCLE_MODE         = 'fixed';  // 'realtime' = follow your PC clock
                                        // 'fast'     = sped-up day/night loop (see FAST_CYCLE_MINUTES)
                                        // 'fixed'    = frozen at FIXED_HOUR
const FAST_CYCLE_MINUTES = 42;          // 'fast' mode: real minutes for one full 24h day
const FAST_START_HOUR    = 6;           // 'fast' mode: time of day the loop starts at
const FIXED_HOUR         = 18.75;        // 'fixed' mode: time of day, 0–24 (18.8 ≈ 6:48 pm)
const LATITUDE           = 47;          // your rough latitude: sets day length and how high the sun gets
const SOLAR_NOON_HOUR    = 'auto';      // clock time the sun is highest. 'auto' = 12:15 (+1h during daylight saving), or e.g. 13.1
const SUN_PATH_SQUEEZE   = 0.35;        // 1 = true compass direction. Lower pulls sunrise/sunset into view on the wide screen

// ---- Performance --------------------------------------------------------------------
const MAX_FPS            = 60;          // frame-rate cap while the mouse moves (or music plays). 0 = uncapped
const IDLE_FPS           = 30;          // frame-rate cap once the mouse has been still for a few seconds. 0 = same as MAX_FPS
const RENDER_SCALE       = 1;        // internal resolution vs. your screen (0.6–0.75 recommended), upscaled to fill
const ANTIALIAS          = true;        // smooths edges. Off is a little faster
const SHADOWS            = true;        // real-time character shadows. Off is faster
const SHADOW_MAP_SIZE    = 2048;        // shadow sharpness. 1024 is a little faster
const SHOW_FPS           = false;       // small FPS counter in the corner (or add ?stats to the URL)

// Test overrides via URL (handy in a browser, ignored by Lively):
//   CozyBeach.html?hour=19.5   ?speed=2 (minutes per day)   ?count=2   ?scale=1   ?maxfps=60   ?stats   ?focus=0..3 (zoom on a character)
//   ?mouseover=0..3 (park the cursor above a character)   ?calm=lively|calm|sleepy   ?settings (open the ⚙ panel)
//   ?weather=rain|storm|fog|heat|cloudy|clear   ?nowplaying=Song|Artist (pretend music is playing)   ?moon=0..1 (moon phase)
//   ?wallpaper  phone live-wallpaper mode: no ⚙ gear on a tap (tap three times quickly to show it)

// =====================================================================

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
window.__beachStarted = true;

// ---------------------------------------------------------------------
//  Small helpers
// ---------------------------------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
// ---- Animation toolkit ----
// Smooth value noise (−1…1): idle motion wanders like a living thing instead of repeating like a sine.
const _nh = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return (v - Math.floor(v)) * 2 - 1; };
const noise1 = (x) => { const i = Math.floor(x), f = x - i, u = f * f * f * (f * (f * 6 - 15) + 10); return _nh(i) * (1 - u) + _nh(i + 1) * u; };
const fbm1 = (x) => noise1(x) * 0.62 + noise1(x * 2.13 + 17.3) * 0.27 + noise1(x * 4.71 + 41.9) * 0.11;
// Springs: follow a target with weight, a touch of overshoot and settle (zeta < 1 = bouncier).
// State { x, v }; freq in Hz. Small substeps keep it steady on slow frames.
const mkSpring = (x = 0) => ({ x, v: 0 });
function spring(sp, target, freq, zeta, dt) {
  const w = 2 * Math.PI * freq, n = Math.min(12, Math.max(1, Math.ceil(dt / 0.012))), h = dt / n;
  for (let i = 0; i < n; i++) { sp.v += (w * w * (target - sp.x) - 2 * zeta * w * sp.v) * h; sp.x += sp.v * h; }
  return sp.x;
}
const eInCubic = (x) => x * x * x;
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const eInOutSine = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
const eOutBack = (x, k = 1.7) => 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2);
const rand = (a, b) => a + Math.random() * (b - a);
const DEG = Math.PI / 180;
let seedState = 20240611;
const srand = () => (seedState = (seedState * 16807) % 2147483647) / 2147483647;
const srange = (a, b) => a + srand() * (b - a);
const hash3 = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };

const Q = new URLSearchParams(location.search);
const qnum = (k, d) => (Q.has(k) && Q.get(k) !== '' && isFinite(+Q.get(k))) ? +Q.get(k) : d;
// Settings actually in use: the SETTINGS block, then anything changed in the ⚙ panel, then URL test overrides.
const FILE_SETTINGS = {
  ACTIVITY_PRESET, MOVE_SPEED, ACTIVITY, IDLE_TIME, BLINK_RATE,
  MOUSE_FOLLOW, MOUSE_DEPTH, MOUSE_IDLE_SECONDS, WAKE_ON_HOVER,
  DEPTH_BLUR, BLUR_START, BLUR_FULL, SKY_BLUR, WATER_BLUR, SATURATION, CONTRAST, WARMTH, VIGNETTE, CAMERA_ZOOM, CAMERA_HEIGHT, CAMERA_DRIFT,
  TALL_GROUP_POSITION, TALL_ZOOM, TALL_PAN, TALL_PALMS, TALL_PALM_LEFT_X, TALL_PALM_LEFT_Z, TALL_PALM_RIGHT_X, TALL_PALM_RIGHT_Z, TALL_PALM_SIZE,
  TILT_PARALLAX, NIGHT_SKY_DARK, PHONE_FPS, PHONE_RESOLUTION, PHONE_BATTERY_SAVER,
  COLOR_GRADE, BLOOM, SUN_RAYS, CONTACT_SHADING, REFLECTIONS, FIRELIGHT_ON_FACES, WATER_SHINE, FILTER, FILTER_SIZE, FILTER_STRENGTH,
  OCEAN_SPEED, CLOUD_SPEED, CLOUD_AMOUNT, FIRE_BRIGHTNESS, SHOW_GULLS, SHOW_SHOOTING_STARS, SHOW_ZZZ, CHARACTER_COUNT, CHARACTER_FLAT_SHADING,
  WIND, SHOW_FIREFLIES, GLOWING_WAVES, SHOW_MARSHMALLOWS, CLICK_TO_INTERACT, NOW_PLAYING_SIGN, DANCE_TO_MUSIC,
  CHARACTER_COLORS,
  WEATHER_MODE, WEATHER_PLACE, WEATHER_LAT, WEATHER_LON, WEATHER_STRENGTH, SEASONS, MOON_PHASES,
  CYCLE_MODE, FAST_CYCLE_MINUTES, FAST_START_HOUR, FIXED_HOUR, LATITUDE, SOLAR_NOON_HOUR, SUN_PATH_SQUEEZE,
  MAX_FPS, IDLE_FPS, RENDER_SCALE, ANTIALIAS, SHADOWS, SHADOW_MAP_SIZE, SHOW_FPS,
};
// Inside the Android app (?app) some defaults suit a phone better. Anything changed in ⚙ still wins.
const IN_APP = Q.has('app');
if (IN_APP) Object.assign(FILE_SETTINGS, { CYCLE_MODE: 'realtime', TILT_PARALLAX: 1, NIGHT_SKY_DARK: 0.6 });
const sameSetting = (a, b) => a === b || JSON.stringify(a) === JSON.stringify(b);
const panelSaved = (() => { try { return JSON.parse(localStorage.getItem('beachSettings') || '{}'); } catch { return {}; } })();
const S = { ...FILE_SETTINGS, CHARACTER_COLORS: JSON.parse(JSON.stringify(CHARACTER_COLORS)) };
for (const k of Object.keys(panelSaved)) {
  if (k === 'CHARACTER_COLORS') {   // colours: take each saved [h, s, l] that is valid
    const saved = panelSaved[k] || {};
    for (const name of Object.keys(S.CHARACTER_COLORS)) for (const part of ['legs', 'body', 'head']) {
      const v = saved[name] && saved[name][part];
      if (Array.isArray(v) && v.length === 3 && v.every(Number.isFinite)) S.CHARACTER_COLORS[name][part] = v.slice();
    }

        vec2 g = vec2(0.0);
        float fw = length(fwidth(p));
        #define WAVE(dx, dz, k, a, sp) { vec2 dd = normalize(vec2(dx, dz)); float att = clamp(1.0 - (k) * fw * 0.3, 0.0, 1.0); g += dd * ((k) * (a) * att) * cos(dot(dd, p) * (k) + t * (sp)); }
        WAVE(0.2, 1.0, 0.55, 0.10, 0.9)
        WAVE(-0.5, 1.0, 0.95, 0.06, 1.2)
        WAVE(0.7, 1.0, 1.7, 0.035, 1.7)
        WAVE(-0.9, 0.6, 2.9, 0.02, 2.3)
        WAVE(0.15, 1.0, 4.6, 0.012, 3.0)
        WAVE(-0.3, 1.0, 7.5, 0.007, 3.8)
        return g;
      }
      void main(){
        vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
        if (n.y < 0.0) n = -n;
        float camDist = length(vWorld - cameraPosition);
        vec2 rg = rippleGrad(vWorld.xz, uTime);
        float detail = mix(0.35, 1.0, smoothstep(12.0, 70.0, camDist));
        n = normalize(vec3(n.x - rg.x * detail, n.y, n.z - rg.y * detail));
        float depth = vWorld.y - sandHeight(vWorld.xz);
        if (depth < -0.02) discard;
        vec3 base = mix(uShallow, uDeep, smoothstep(0.05, 1.8, depth));
        // very shallow water lets the sand show through
        base = mix(uShallow * vec3(1.3, 1.18, 0.86) + vec3(0.04, 0.03, 0.0), base, smoothstep(0.0, 0.2, depth));
        float facet = 0.8 + 0.3 * clamp(dot(n, normalize(uLightDir)), 0.0, 1.0);
        vec3 col = base * facet;
        vec3 v = normalize(cameraPosition - vWorld);
        float fres = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 4.0);
        col = mix(col, uHorizon, fres * 0.55);
        // reflections of the sky, islands, palms and sun (rendered from a mirrored camera)
        if (uReflect > 0.0) {
          vec4 rc = uReflMatrix * vec4(vWorld.x, uLevel, vWorld.z, 1.0);
          vec2 ruv = rc.xy / rc.w + n.xz * 0.045 * (1.0 - smoothstep(20.0, 200.0, camDist) * 0.6);
          vec3 refl = texture2D(tReflect, clamp(ruv, 0.001, 0.999)).rgb;
          col = mix(col, refl, clamp((0.12 + 0.6 * fres) * uReflect, 0.0, 0.65) * smoothstep(0.0, 0.25, depth));
        }
        vec3 r = reflect(-v, n);
        float g = pow(clamp(dot(r, normalize(uGlintDir)), 0.0, 1.0), 90.0) * uGlint;
        col += uGlintColor * g * 1.4;
        // glittering path of sun- or moonlight: tiny sparkles under the light, sharp on any screen
        if (uShine > 0.0 && uGlint > 0.0) {
          vec3 toF = normalize(vWorld - cameraPosition), G = normalize(uGlintDir);
          float dAz = atan(toF.x, -toF.z) - atan(G.x, -G.z);
          float pathW = 0.045 + 0.16 * (1.0 - smoothstep(0.0, 0.45, G.y));
          float path = exp(-dAz * dAz / (pathW * pathW));
          float lobe = pow(clamp(dot(r, G), 0.0, 1.0), 7.0);
          vec2 cellC = floor(gl_FragCoord.xy / 3.0); float tw = floor(uClock * 7.0);
          float sp = hash12(cellC + tw * vec2(1.7, 9.2));
          vec2 o = 0.5 + 2.0 * vec2(hash12(cellC + tw + 4.1), hash12(cellC + tw + 8.3));   // where in the cell the glint sits
          float dot1 = 1.0 - smoothstep(0.45, 1.25, length(mod(gl_FragCoord.xy, 3.0) - o));
          float spark = smoothstep(0.965, 1.0, sp) * dot1 * smoothstep(0.55, 0.95, dot(r, G));
          col += uGlintColor * uShine * uGlint * path * (lobe * 0.3 + spark * (0.7 + 1.8 * lobe)) * (1.0 - smoothstep(0.08, 0.0, depth));
        }
        // foam: leading edge of the swash, lacy foam left as it drains, incoming lines, whitecaps
        float edge = 1.0 - smoothstep(0.0, 0.04 + 0.1 * vSurge, depth);
        float lace = sin(vWorld.x * 2.6 + sin(vWorld.z * 3.1 + uTime * 0.2) * 1.8) * sin(vWorld.z * 3.4 + vWorld.x * 0.8 - uTime * 0.25);
        lace = smoothstep(0.35, 0.75, lace) * (1.0 - smoothstep(0.02, 0.22 + 0.1 * (1.0 - vSurge), depth)) * 0.7;
        float lap = sin(depth * 9.0 - uTime * 1.2 + sin(vWorld.x * 0.21) * 1.5);
        float lines = smoothstep(0.9, 0.985, lap) * (1.0 - smoothstep(0.08, 0.5, depth)) * 0.55;
        // ripples lapping around the palm-tree mounds
        float rings = 0.0;
        ${PALM_RINGS}
        rings *= (1.0 - smoothstep(0.05, 0.6, depth)) * 0.75;
        // whitecaps, computed per pixel so they stay sharp in the distance
        float farZ = -vWorld.z;
        float swp = sin(vWorld.z * 0.16 + uTime * 0.75 + sin(vWorld.x * 0.045) * 1.4);
        float crest = smoothstep(0.9 - 0.14 * uRough, 0.985, swp) * smoothstep(3.0, 16.0, farZ) * (1.0 - smoothstep(40.0, 220.0, farZ))
                    * (0.55 + 0.45 * sin(vWorld.x * 0.37 + vWorld.z * 0.11 + uTime * 0.4));
        // island shores: turquoise shallows, a foam collar and lapping rings
        float isl = islandField(vWorld.xz);
        float shallowsI = 1.0 - smoothstep(1.0, 2.4, isl);
        col = mix(col, uShallow * facet * 1.1, shallowsI * 0.65);
        float islFoam = 1.0 - smoothstep(0.95, 1.2 + 0.06 * sin(uTime * 0.9 + vWorld.x * 0.07), isl);
        float islLap = smoothstep(0.8, 0.97, sin(isl * 11.0 - uTime * 1.3)) * (1.0 - smoothstep(1.1, 1.9, isl));
        float foam = max(max(edge, lace), max(max(lines, crest * 0.6), max(rings, max(islFoam * 0.95, islLap * 0.55))));
        // raindrops: little rings popping up everywhere close by
        if (uRain > 0.0) {
          vec2 rp = vWorld.xz * 2.2; vec2 cell = floor(rp), f = fract(rp) - 0.5;
          float h0 = hash12(cell), ph = fract(uClock * 1.4 + h0);
          vec2 off = vec2(hash12(cell + 3.1), hash12(cell + 7.7)) - 0.5;
          float ring = 1.0 - smoothstep(0.0, 0.05, abs(length(f - off * 0.5) - ph * 0.42));
          foam = max(foam, ring * (1.0 - ph) * uRain * 0.55 * (1.0 - smoothstep(10.0, 45.0, camDist)));
        }
        col = mix(col, uFoam, clamp(foam, 0.0, 1.0));
        // glowing (bioluminescent) waves on dark nights
        if (uBio > 0.0) {
          float glowF = max(max(edge, lines * 1.4), max(crest * 0.9, lace * 0.6));
          col += vec3(0.12, 0.72, 1.0) * glowF * uBio * (0.75 + 0.35 * sin(uClock * 1.7 + vWorld.x * 0.6 + vWorld.z * 0.3));
        }
        // campfire glow reaching the shallows at night
        col += uFireColor * (1.0 - smoothstep(0.0, 9.0, length(vWorld.xz - vec2(${FIRE_POS.x.toFixed(2)}, ${FIRE_POS.z.toFixed(2)}))));
        col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, camDist));
        gl_FragColor = vec4(col, 0.0);   // alpha 0 marks "sea" for the depth blur (see WATER_BLUR); the screen ignores alpha
        #include <colorspace_fragment>
      }`,
  });
  scene.add(new THREE.Mesh(g, mat));
}

// Moon phase from the date (mean synodic month, counted from a known new moon). ?moon=0..1 overrides for testing.
function moonInfo() {
  const P = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const phase = Q.has('moon') ? ((qnum('moon', 0.5) % 1) + 1) % 1 : ((((Date.now() - ref) / 86400000) % P + P) % P) / P;   // 0 new, 0.25 first quarter, 0.5 full
  return { phase, illum: (1 - Math.cos(2 * Math.PI * phase)) / 2 };
}
const moonUniforms = { uLight: { value: new THREE.Vector3(0, 0, 1) }, uNight: { value: 1 } };

  vertexShader: 'varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix * normal); vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: /* glsl */`
    uniform vec3 uLight; uniform float uNight; varying vec3 vN; varying vec3 vP;
    void main(){
      vec3 n = normalize(vN);
      float lit = smoothstep(-0.07, 0.12, dot(n, normalize(uLight)));
      // soft grey "seas" so it reads as the moon
      vec3 q = vP / 13.0;
      float maria = smoothstep(0.25, 0.75, 0.5 + 0.35 * sin(q.x * 3.1 + 1.0) * sin(q.y * 2.7 - 0.4) + 0.25 * sin(q.x * 5.3 + q.y * 4.1));
      vec3 bright = mix(vec3(0.96, 0.94, 0.86), vec3(0.78, 0.78, 0.76), maria * 0.6);

      float a = mix(lit * 0.6, lit + (1.0 - lit) * 0.9, uNight); // by day only the lit part shows, pale

      #include <colorspace_fragment>
    }`,
}));

// ---- Clouds: thin wispy streaks layered near the horizon, drifting slowly ----
// Each layer is a few wide, camera-facing panels with an animated noise shader (no geometry to speak of).
const cloudUniforms = {
  uTime: { value: 0 }, uCoverage: { value: 0.4 }, uOpacity: { value: 0.9 },
  uLit: { value: new THREE.Color('#ffffff') }, uShade: { value: new THREE.Color('#b8c8e0') },
  uGlow: { value: new THREE.Color('#ffb070') }, uGlowAmt: { value: 0 }, uSunDir: { value: new THREE.Vector3(0, 1, 0) },
};
const clouds = [];
{
  const vert = `varying vec2 vUv; varying vec3 vDir;
    void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position, 1.0); vDir = normalize(wp.xyz - cameraPosition); gl_Position = projectionMatrix * viewMatrix * wp; }`;
  const frag = `
    uniform float uTime, uCoverage, uOpacity, uGlowAmt, uSeed, uDrift, uStreak;
    uniform vec3 uLit, uShade, uGlow, uSunDir; varying vec2 vUv; varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.07 + 13.1; a *= 0.5; } return v; }
    void main(){
      vec2 p = vec2(vUv.x * 6.0 + uSeed + uTime * uDrift, vUv.y * 1.3);
      float warp = fbm(p * vec2(0.5, 2.0) + 7.3);
      float n = fbm(vec2(p.x * 0.55 + warp * 0.6, p.y * uStreak + warp * 1.2));
      float band = smoothstep(0.0, 0.4, vUv.y) * (1.0 - smoothstep(0.6, 1.0, vUv.y));
      float ends = smoothstep(0.0, 0.18, vUv.x) * (1.0 - smoothstep(0.82, 1.0, vUv.x));
      float th = 1.0 - uCoverage;
      float a = smoothstep(th, th + 0.22, n * (0.7 + 0.5 * band)) * band * ends;
      float sun = pow(max(dot(normalize(vDir), uSunDir), 0.0), 5.0);
      vec3 col = mix(uShade, uLit, smoothstep(0.35, 0.85, n));
      col = mix(col, uGlow * 1.25, clamp(sun * uGlowAmt, 0.0, 1.0));
      gl_FragColor = vec4(col, a * uOpacity);
      #include <colorspace_fragment>
    }`;
  const layers = [   // distance, height range, panel width/height, panels, streak (higher = thinner lines), drift speed
    { dist: 860, y: [24, 42],  w: 900, h: 90, n: 3, streak: 3.4, drift: 0.010 },
    { dist: 640, y: [42, 72],  w: 560, h: 70, n: 4, streak: 4.2, drift: 0.014 },
    { dist: 480, y: [64, 100], w: 420, h: 52, n: 3, streak: 5.2, drift: 0.018 },
  ];
  for (const L of layers) for (let i = 0; i < L.n; i++) {
    const ang = ((i + 0.5) / L.n - 0.5) * 130 * DEG + srange(-8, 8) * DEG;
    const mat = new THREE.ShaderMaterial({
      uniforms: { ...cloudUniforms, uSeed: { value: srange(0, 100) }, uDrift: { value: L.drift * srange(0.8, 1.2) }, uStreak: { value: L.streak } },

    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(L.w * srange(0.85, 1.15), L.h * srange(0.8, 1.2)), mat);
    m.position.set(Math.sin(ang) * L.dist, srange(...L.y), -Math.cos(ang) * L.dist);
    m.lookAt(0, m.position.y, 15);
    m.renderOrder = -7;
    clouds.push(m); scene.add(m);
  }
}

function makeRock(w, h, d, color, detail = 1, flatTop = true) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const j = 0.86 + hash3(Math.round(x * 1000), Math.round(y * 1000), Math.round(z * 1000)) * 0.28;
    x *= j; y *= j; z *= j;
    let yy = (y + 1) / 2 * (h + 0.3) - 0.3;
    const cap = h * 0.82;
    if (flatTop && yy > cap) yy = cap + (yy - cap) * 0.3;
    p.setXYZ(i, x * w, yy, z * d);
  }
  g.computeVertexNormals();
  g.computeBoundingBox();
  const m = new THREE.Mesh(g, lam(color));
  m.castShadow = S.SHADOWS; m.receiveShadow = S.SHADOWS;
  m.userData.top = g.boundingBox.max.y;
  return m;
}

// Palm tree
const palms = [];
function makePalm({ x, z, h: height, lean, rot: rotY }) {
  const g = new THREE.Group();
  const trunkA = lam('#9b7347'), trunkB = lam('#86613a');
  const segs = 8, segLen = height / segs;
  let px = 0, py = 0;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    pts.push(new THREE.Vector3(lean * t * t, t * height, 0));
  }
  for (let i = 0; i < segs; i++) {
    const a = pts[i], b = pts[i + 1];
    const r0 = 0.24 - i * 0.012, r1 = r0 - 0.012;
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0 * 1.08, a.distanceTo(b) * 1.04, 6), i % 2 ? trunkA : trunkB);
    cyl.position.copy(a).add(b).multiplyScalar(0.5);
    cyl.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
    cyl.castShadow = S.SHADOWS;
    g.add(cyl);
  }
  const crown = new THREE.Group();
  crown.position.copy(pts[segs]);
  g.add(crown);
  const leafA = lam('#3f8c3c', { side: THREE.DoubleSide }), leafB = lam('#5aa645', { side: THREE.DoubleSide });
  const fronds = 8;
  for (let f = 0; f < fronds; f++) {
    const L = srange(2.3, 2.9), n = 6;
    const verts = [];
    const pt = (u, side) => {
      const w = 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.05)), 0.7) * (1 - u * 0.25);
      const y = 0.35 * u * L - 1.25 * u * u * L * 0.55;
      return [side * w, y + (side === 0 ? 0.07 : -0.05), u * L];
    };
    for (let i = 0; i < n; i++) {
      const u0 = i / n, u1 = (i + 1) / n;
      for (const s of [-1, 1]) {
        const a = pt(u0, 0), b = pt(u1, 0), c = pt(u0, s), d = pt(u1, s);
        verts.push(...a, ...c, ...b, ...b, ...c, ...d);
      }
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    fg.computeVertexNormals();
    const frond = new THREE.Mesh(fg, f % 2 ? leafA : leafB);
    frond.rotation.y = (f / fronds) * Math.PI * 2 + srange(-0.2, 0.2);
    frond.rotation.x = srange(-0.15, 0.2);
    frond.castShadow = S.SHADOWS;
    frond.userData.baseX = frond.rotation.x;
    frond.userData.ph = srand() * 6;
    crown.add(frond);
  }
  const nutMat = lam('#5b3c22');
  for (let k = 0; k < 3; k++) {
    const nut = new THREE.Mesh(new THREE.IcosahedronGeometry(0.15, 0), nutMat);
    nut.position.set(Math.cos(k * 2.1) * 0.18, -0.15, Math.sin(k * 2.1) * 0.18);
    crown.add(nut);
  }
  // Base: flared trunk, roots gripping the mound, a few stones and a fallen coconut
  const flare = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.46, 0.42, 7), trunkB);
  flare.position.y = 0.1; flare.castShadow = S.SHADOWS; flare.receiveShadow = S.SHADOWS; g.add(flare);
  const rootMat = lam('#7a5a36');
  for (let k = 0; k < 6; k++) {
    const a = k / 6 * Math.PI * 2 + srange(-0.3, 0.3);
    const root = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.08, 0.62, 5), rootMat);

// Paint one character's three materials from S.CHARACTER_COLORS ([hue 0–360, sat 0–100, light 0–100], sRGB like CSS hsl()).
function paintCharacter(c) {
  const cols = S.CHARACTER_COLORS[c.def.name];
  if (!cols) return;
  for (const part of COLOR_PARTS) {
    const [h, s, l] = cols[part];
    c.mats[part].color.setHSL((((h % 360) + 360) % 360) / 360, clamp(s, 0, 100) / 100, clamp(l, 0, 100) / 100, THREE.SRGBColorSpace);

  const ml = new THREE.Mesh(capsuleGeo(r * 0.94, lenL), mat); lower.add(ml);
  const end = new THREE.Group(); end.position.y = -lenL; lower.add(end);

    em = new THREE.Mesh(cached('hand', () => new THREE.SphereGeometry(0.088, 12, 9)), endMat);

// Poses (all in the character's body space, facing +Z)
// A dangling leg: a pendulum whose tempo and size wander (sometimes nearly still, sometimes kicking),
// that falls in with the beat while music plays. The foot trails the swing. Returns [swing, foot lag].
function legSwing(c, i, a) {
  const st = c.st, rt = a.rt;
  let tempo = 2.1 * (0.85 + 0.3 * noise1(rt * 0.05 + c.seed + i * 3.1)) * Math.sqrt(calm().speed);
  let amp = 0.3 * (0.2 + 0.8 * smooth(-0.35, 0.55, noise1(rt * 0.06 + c.seed * 2 + i * 5.7))) + 0.03;
  tempo = lerp(tempo, Math.PI * music.bpm / 60, music.groove);   // one swing every two beats
  amp = lerp(amp, 0.3, music.groove) * (1 - a.doze);
  st.legPh[i] += a.dt * tempo * (1 - 0.7 * a.doze);
  st.legAmp[i] = damp(st.legAmp[i], amp, 1.2, a.dt);
  return [Math.sin(st.legPh[i]) * st.legAmp[i], Math.cos(st.legPh[i]) * st.legAmp[i]];
}

    const i = st.waveSide, s = i ? 1 : -1, L = c.arms[i];
    _u.copy(L.dirU).lerp(_v.set(s * 0.55, 1, 0.22), wave); _l.copy(L.dirL).lerp(_w.set(s * (0.1 + 0.6 * waveSwing), 1, 0.12), wave);
    aimLimb(L, _u, _l);
  }
  // arms fly up and out a little in the air during a hop
  if (hop > 0.02) for (let i = 0; i < 2; i++) {
    const L = c.arms[i], s = i ? 1 : -1;
    aimLimb(L, _u.copy(L.dirU).lerp(_v.set(s * 0.9, 0.25, 0.1), hop * 0.55), _l.copy(L.dirL).lerp(_w.set(s * 0.5, 0.8, 0.1), hop * 0.5));
  }
  // lean back a little when looking high up, puff up on a sigh, slump after it, bend into a crouch
  c.chestPivot.rotation.x += -Math.max(0, st.lookPitch - 0.6) * 0.35 + 0.06 * slump - 0.04 * sigh + 0.05 * crouch;
  // props last, once the chest has settled for this frame, so held things stay in the hands
  for (const h of c.hooks) h(c, t, dt);   // dancing, marshmallow stick, the now-playing sign

  // Head (with a little wandering of its own, so nobody ever holds perfectly still)
  const ny = fbm1(ta * 0.17 + c.seed * 3) * 0.05 * (1 - 0.7 * st.mouseW) * (1 - doze);
  const np = fbm1(ta * 0.19 + c.seed * 5) * 0.03 * (1 - doze);
  c.head.rotation.y = st.lookYaw * 0.72 + ny;
  c.head.rotation.x = -st.lookPitch + dozeHead * (0.5 + 0.08 * br) - yawn * 0.42 + yawnPre * 0.1 - startle * 0.3 + 0.015 * br
    + talk * 0.07 + st.nod + listen * 0.09 - sigh * 0.1 + slump * 0.08 + np;
  const shake = (wakeP > 0.3 && wakeP < 0.75) ? 0.14 * Math.sin((wakeP - 0.3) * 40) * (0.75 - wakeP) * 2.2 : 0;
  const ws = st.waveSide ? 1 : -1;
  c.head.rotation.z = dozeHead * 0.18 * c.sideToCam + fbm1(ta * 0.23 + c.seed) * 0.05 + shake + yawnShake * 0.06
    + talkEnv * 0.05 * noise1(ta * 0.9 + c.seed * 2) - ws * 0.09 * Math.min(1, wave) + (st.danceTilt || 0);

  // Snout (the mouth) swells while yawning or talking, never opens
  const grow = Math.max(yawn, talk * 0.55, c.blow || 0);
  c.snoutMesh.scale.set(1 + 0.6 * grow, 1 + 0.6 * grow, 1 + 0.32 * grow);

  // Eyes
  c.sharpMat.opacity = 1 - doze;
  c.blurMat.opacity = doze;
  const wbl = wakeP >= 0 ? Math.max(0, 1 - Math.abs(wakeP - 0.5) / 0.04, 1 - Math.abs(wakeP - 0.62) / 0.04) : 0;
  const wide = wakeP >= 0 ? 1 + 0.35 * Math.max(0, 1 - wakeP * 2.2) : 1;
  const lookDown = clamp(-st.lookPitch, 0, 0.45);   // lids follow the eyes down a little
  const lidY = Math.max(0.06, Math.min(1 - 0.94 * blink, 1 - 0.94 * wbl, 1 - 0.72 * yawn, 1 - 0.5 * dozeHead, 1 - 0.45 * lookDown) * wide);
  // Eyes jump between targets (saccades) and flick slightly while holding still, ahead of the head
  if (t > st.sacNext) { st.sacNext = t + rand(0.35, 1.6); st.microX = rand(-1, 1) * 0.006; st.microY = rand(-1, 1) * 0.005; }
  for (const e of c.eyes) {
    e.group.worldToLocal(_e.copy(_look)).normalize();
    let ox = _e.x, oy = _e.y;
    const len = Math.hypot(ox, oy), m = 0.046;
    if (len > 1e-4) { const k = Math.min(1, len * 1.4) * m / len; ox *= k; oy *= k; }
    ox = ox * (1 - 0.8 * doze) + st.microX * (1 - doze); oy = oy * (1 - doze) - 0.02 * doze + st.microY * (1 - doze);
    if (e.tx === undefined || Math.hypot(ox - e.tx, oy - e.ty) > 0.011 || doze > 0.5) { e.tx = ox; e.ty = oy; }
    const er = 38 * Math.sqrt(cm.speed); e.ox = damp(e.ox, e.tx, er, dt); e.oy = damp(e.oy, e.ty, er, dt);
    e.pupil.position.x = e.ox; e.pupil.position.y = e.oy;
    e.lid.scale.y = lidY;
  }
}

const TEST_MOUSE_OVER = Q.has('mouseover') ? clamp(Math.round(qnum('mouseover', 0)), 0, 3) : -1;   // test: park the cursor above a character
function updateCharacters(dt, t) {
  const now = performance.now();
  animT += dt * calm().speed;
  if (TEST_MOUSE_OVER >= 0) {
    const c = characters.find((q) => q.index === TEST_MOUSE_OVER);
    if (c) { c.skull.getWorldPosition(_hw); _hw.y += 1.4 * c.def.scale; _hw.project(camera); mouseNdc.set(_hw.x, _hw.y); lastMouseMove = now - 1000; mouseEverMoved = true; }
  }
  const mouseActive = S.MOUSE_FOLLOW && mouseEverMoved && (now - lastMouseMove) < S.MOUSE_IDLE_SECONDS * 1000;
  if (!mouseActive) mouseWasIdle = true;
  if (mouseEverMoved) {
    lookPlane.constant = -(0.6 + S.MOUSE_DEPTH);   // plane through the characters' heads, facing the camera
    raycaster.setFromCamera(mouseNdc, camera);
    if (raycaster.ray.intersectPlane(lookPlane, _hw)) { _hw.y = clamp(_hw.y, 0.2, 14); mouseTarget.copy(_hw); }
  }

  updateMusic(t, dt);
  updateRoast(t, dt);
  updateSign(t, dt);
  for (const c of characters) if (c !== roast.c && !(sign && c === sign.bo && sign.p > 0.001)) c.busy = false;

  // Brushing the cursor across a sleeper's face wakes them up
  if (S.WAKE_ON_HOVER && mouseEverMoved && now - lastMouseMove < 150) {
    for (const c of characters) {
      if (!c.st.dozing || c.st.doze < 0.25) continue;
      c.skull.getWorldPosition(_hw);
      if (raycaster.ray.distanceToPoint(_hw) < 0.42 * c.def.scale) wakeUp(c, t);
    }
  }

  // One character dozes off now and then (more often at night)
  if (t > nextDozeAt) {
    if (!characters.some((c) => c.st.dozing)) {
      const pool = (sitters.length ? sitters : characters).filter((c) => c.st.yawnStart < 0 && c.st.waveStart < 0 && !c.busy);
      if (pool.length) {
        const c = pool[Math.floor(Math.random() * pool.length)];
        c.st.dozing = true; c.st.dozeEnd = t + rand(14, 28);
      }
    }
    nextDozeAt = t + rand(45, 100) * (env.night > 0.5 ? 0.6 : 1) / calm().activity;
  }
  // Occasional unprompted wave from the standing one
  if (waver && waver.st.waveStart < 0 && !waver.st.dozing && Math.random() < dt / 140 * calm().activity) waver.st.waveStart = t;

  for (const c of characters) {
    if (c.st.dozing && t > c.st.dozeEnd) { c.st.dozing = false; c.st.startle = 0.35; c.st.nextYawn = t + rand(1, 2.5); }
    updateCharacter(c, dt, t, mouseActive);
  }

  // Foot contact shadows: strongest when the foot is on the sand, fading as it lifts
  for (const c of characters) for (let i = 0; i < 2; i++) {
    const b = c.footBlobs[i];
    c.legs[i].end.getWorldPosition(_hw);
    let gy = sandHeight(_hw.x, _hw.z);
    if (c.def.pose === 'crisscross') gy = Math.max(gy, towelY);
    const k = 1 - smooth(0.06, 0.55, _hw.y - gy);
    b.visible = k > 0.01;
    if (!b.visible) continue;
    const s = (0.34 + (_hw.y - gy) * 0.4) * c.def.scale;
    b.scale.set(s, 1, s * 1.35);
    b.rotation.y = c.yaw;
    b.position.set(_hw.x, gy + 0.025, _hw.z + 0.03);
    b.material.opacity = 0.55 * k * (0.7 + 0.3 * env.day);
  }

  // "!" pop when someone gets woken up
  if (bang.life >= 0) {
    bang.life += dt;
    if (bang.life > 1.3) { bang.life = -1; bang.s.visible = false; }
    else {
      bang.c.skull.getWorldPosition(_hw);
      const sc = bang.c.def.scale, L = bang.life;
      const pop = Math.max(0, spring(bang.sp, L < 1.0 ? 1 : 0.7, 3.4, 0.28, dt));
      bang.s.position.set(_hw.x, _hw.y + (0.55 + 0.22 * eOutCubic(Math.min(1, L / 0.5))) * sc, _hw.z);
      bang.s.scale.setScalar(0.42 * sc * pop);
      bang.s.material.rotation = 0.35 * Math.sin(L * 16) * Math.exp(-L * 3.5);
      bang.s.material.opacity = 1 - smooth(0.9, 1.3, L);
    }
  }

  // Zzz
  const dozer = characters.find((c) => c.st.doze > 0.6 && c.st.dozing);
  if (dozer && S.SHOW_ZZZ) {
    zzzTimer -= dt;
    if (zzzTimer <= 0) {
      zzzTimer = rand(0.95, 1.45);
      const z = zzz.find((q) => !q.s.visible);
      if (z) {
        dozer.skull.getWorldPosition(_hw);
        const sc = dozer.def.scale;
        z.s.position.set(_hw.x + 0.18 * sc, _hw.y + 0.38 * sc, _hw.z + 0.1);
        z.x0 = z.s.position.x; z.y0 = z.s.position.y; z.life = 0; z.ph = Math.random() * 6; z.sc = sc; z.k = rand(0.8, 1.15); z.rot = rand(-0.3, 0.3); z.s.visible = true;
      }
    }
  }
  for (const z of zzz) {
    if (!z.s.visible) continue;
    z.life += dt;
    if (z.life > 3.4) { z.s.visible = false; continue; }
    const L = z.life, rise = eOutCubic(Math.min(1, L / 3.4));
    z.s.position.y = z.y0 + rise * 1.05;
    z.s.position.x = z.x0 + Math.sin(L * 2.0 + z.ph) * 0.1 * Math.min(1, L) + rise * 0.4;
    z.s.scale.setScalar((0.28 + L * 0.1) * z.sc * (z.k || 1) * (L < 0.35 ? eOutBack(L / 0.35, 2) : 1));
    z.s.material.rotation = (z.rot || 0) + 0.25 * Math.sin(L * 1.6 + z.ph);
    z.s.material.opacity = Math.min(1, L * 4) * (1 - smooth(2.4, 3.4, L));
  }
}

// ---------------------------------------------------------------------
//  Look: everything after the 3D render. Reflections are a second, half-size render from a mirrored camera.
//  Depth blur, bloom, sun rays and contact shading (ambient occlusion) run at quarter resolution, then one
//  full-screen pass combines them with heat shimmer and the colour grade. Each effect is skipped when set to 0.
// ---------------------------------------------------------------------
const GRADES = {   // colour-grade presets (COLOR_GRADE)
  natural: { sat: 1,    con: 1,    warm: 0,     exp: 1,    tint: [1, 1, 1],          lift: [0, 0, 0] },
  film:    { sat: 0.9,  con: 1.08, warm: 0.12,  exp: 1,    tint: [1, 0.98, 0.94],    lift: [0.03, 0.025, 0.04] },
  golden:  { sat: 1.08, con: 1.04, warm: 0.5,   exp: 1.04, tint: [1.04, 0.99, 0.9],  lift: [0.02, 0.01, 0] },
  pastel:  { sat: 0.78, con: 0.88, warm: 0.05,  exp: 1.06, tint: [1, 1, 1],          lift: [0.07, 0.06, 0.08] },
  moody:   { sat: 0.82, con: 1.16, warm: -0.3,  exp: 0.94, tint: [0.95, 0.98, 1.04], lift: [0, 0.01, 0.035] },

const post = (() => {

  tri.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));

  main.texture.colorSpace = THREE.SRGBColorSpace;          // 8-bit sRGB storage: no banding, cheap
  main.depthTexture = new THREE.DepthTexture(1, 1, THREE.UnsignedIntType);
  const small = () => { const rt = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: false, stencilBuffer: false }); rt.texture.colorSpace = THREE.SRGBColorSpace; return rt; };
  const blurA = small(), blurB = small(), bloomA = small(), bloomB = small(), raysA = small(), raysB = small(), aoA = small(), aoB = small();
  const refl = new THREE.WebGLRenderTarget(1, 1, { stencilBuffer: false }); refl.texture.colorSpace = THREE.SRGBColorSpace;
  const vert = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const depthGLSL = `#include <packing>
    uniform sampler2D tDepth; uniform float uNear, uFar, uStart, uFull, uSky, uWater;
    float viewDist(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, uNear, uFar); }
    float blurAmount(vec2 uv){

      float k = smoothstep(uStart, uFull, z);

    }`;
  const depthUniforms = () => ({ tDepth: { value: main.depthTexture }, uNear: { value: 0.5 }, uFar: { value: 2000 }, uStart: { value: 18 }, uFull: { value: 140 }, uSky: { value: 0.3 }, uWater: { value: 0.15 } });
  const shader = (uniforms, frag) => new THREE.ShaderMaterial({ uniforms, vertexShader: vert, fragmentShader: frag, depthTest: false, depthWrite: false });

    uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;
    void main(){

    void main(){

    uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uThresh; varying vec2 vUv;

    uniform vec2 uSun; uniform float uAspect; varying vec2 vUv;

    uniform vec2 uP, uTexel; uniform float uRadius; uniform vec3 uUp; varying vec2 vUv;

        vec3 q = viewPos(suv);

      ao = mix(ao, 1.0, smoothstep(32.0, 48.0, dist));

    uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;
    void main(){
      float z0 = viewDist(vUv), sum = 0.0, wsum = 0.0;
      for (int i = -3; i <= 3; i++) {

    }`);

    tSharp: { value: main.texture }, tBlur: { value: blurB.texture }, tBloom: { value: bloomB.texture }, tRays: { value: raysB.texture }, tAO: { value: aoB.texture },
    uStrength: { value: 0 }, uSat: { value: 1 }, uContrast: { value: 1 }, uWarm: { value: 0 }, uVignette: { value: 0 }, uExposure: { value: 1 },
    uTint: { value: new THREE.Vector3(1, 1, 1) }, uLift: { value: new THREE.Vector3() }, uBloom: { value: 0 }, uRays: { value: 0 }, uRayColor: { value: new THREE.Color() },

    uniform sampler2D tSharp, tBlur, tBloom, tRays, tAO;

  // One tab at a time so each page fits on screen without scrolling (Lively doesn't pass the mouse
  // wheel to wallpapers). If a page is still taller than the screen, drag its background to scroll.
  const TABS = ['Presets', ...PANEL_GROUPS.map(([title]) => title), 'Colours'];
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} return null; };
  let tab = TABS.includes(store('beachPanelTab')) ? store('beachPanelTab') : 'Presets';
  let who = CHAR_DEFS.some((d) => d.name === store('beachPanelWho')) ? store('beachPanelWho') : CHAR_DEFS[0].name;

  function build() {
    const scroll = panel.scrollTop;
    panel.innerHTML = '';
    panel.append(el('div', { className: 'top' }, el('h2', { textContent: 'Wallpaper settings' }), btn('✕', () => { panel.hidden = true; }, 'btn icon')));
    const tabs = el('div', { className: 'tabs' });
    for (const t of TABS) tabs.append(chip(t, t === tab, () => { tab = t; store('beachPanelTab', t); panel.scrollTop = 0; build(); }));
    panel.append(tabs);

    if (tab === 'Colours') buildColours();
    else if (tab === 'Presets') buildPresets();
    else {
      if (tab === 'Weather') panel.append(el('p', { className: 'hint', textContent: `${S.WEATHER_PLACE} now: ${weatherStatus.text}` }));
      for (const it of PANEL_GROUPS.find(([t]) => t === tab)[1]) {
        const id = 'set-' + it.k;
        const label = el('label', { htmlFor: id, textContent: it.label });
        if (it.reload) label.append(el('span', { className: 'tag', textContent: 'reload' }));
        const row = el('div', { className: 'row' + (it.custom && S.ACTIVITY_PRESET !== 'custom' ? ' dim' : '') });
        if (it.options) {                                  // buttons instead of a drop-down (pop-up lists can fail in a wallpaper)
          const seg = el('div', { className: 'seg' });
          for (const [v, t] of it.options) seg.append(chip(t, S[it.k] === v, () => { set(it, v); build(); }));
          row.append(label, seg);
        } else if (it.min === undefined) {
          const cb = el('input', { id, type: 'checkbox', checked: !!S[it.k] });
          cb.onchange = () => { set(it, cb.checked); build(); };
          row.append(label, cb);
        } else {
          const val = el('span', { className: 'val', textContent: fmt(it, shown(it)) });
          const rg = el('input', { id, type: 'range', min: it.min, max: it.max, step: it.step, value: shown(it) });
          rg.oninput = () => {
            const wasPreset = it.custom && S.ACTIVITY_PRESET !== 'custom';
            set(it, +rg.value); val.textContent = fmt(it, +rg.value);
            if (wasPreset) build();
          };
          rg.onchange = () => { if (it.reload) build(); };
          row.append(label, val, rg);
        }
        panel.append(row);
      }
    }

    const actions = el('div', { className: 'actions' });
    if (needsReload) actions.append(btn('Reload to apply', () => location.reload(), 'btn primary'));
    actions.append(btn('Reset to file values', () => { try { localStorage.removeItem('beachSettings'); } catch {} location.reload(); }));
    panel.append(actions);
    panel.append(el('p', { className: 'hint', textContent: 'Saved in this browser. Presets → "Copy as code" gives lines to paste into the SETTINGS block of CozyBeach.html.' }));
    panel.scrollTop = scroll;
  }
  window.__panelRebuild = () => { if (!panel.hidden) build(); };

  // Presets: built-in looks, three save slots, copy as code, export / import
  function buildPresets() {
    panel.append(el('h3', { textContent: 'Looks' }));
    const seg = el('div', { className: 'seg' });
    for (const [name, vals] of Object.entries(BUILTIN_PRESETS)) seg.append(chip(name, false, () => { applySettings(vals); build(); }));
    panel.append(seg, el('p', { className: 'hint', textContent: 'Each look changes only a few settings (time of day, weather, effects). The rest stay as they are.' }));

    panel.append(el('h3', { textContent: 'Your presets' }));
    let slots = []; try { slots = JSON.parse(store('beachPresets') || '[]'); } catch {}
    for (let i = 0; i < 3; i++) {
      const sl = slots[i];
      const row = el('div', { className: 'row' });
      row.append(el('label', { textContent: sl ? `${sl.name}` : `Slot ${i + 1}: empty` }));
      const b = el('div', { className: 'seg' });
      b.append(chip('Save here', false, () => {
        const snap = {}; for (const k of Object.keys(FILE_SETTINGS)) snap[k] = S[k];
        slots[i] = { name: `Slot ${i + 1} · ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`, settings: JSON.parse(JSON.stringify(snap)) };
        store('beachPresets', JSON.stringify(slots)); build();
      }));
      if (sl) b.append(chip('Load', false, () => { applySettings(sl.settings); build(); }));
      row.append(b); panel.append(row);
    }

    panel.append(el('h3', { textContent: 'Copy, export and import' }));
    const box = el('textarea', { placeholder: 'Exported settings appear here. To import, paste them here and press "Import pasted".' });
    const out = (text) => { box.value = text; box.select(); if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); };
    const io = el('div', { className: 'actions' });
    io.append(btn('Copy as code', () => {
      const lines = Object.keys(FILE_SETTINGS).filter((k) => !sameSetting(S[k], FILE_SETTINGS[k]) && !URL_KEYS.has(k)).map((k) => {
        if (k === 'CHARACTER_COLORS') {
          const body = Object.entries(S[k]).map(([n, p]) => `  ${(n + ':').padEnd(4)} { ${COLOR_PARTS.map((q) => `${q}: [${p[q].join(', ')}]`).join(', ')} },`);
          return `const CHARACTER_COLORS = {\n${body.join('\n')}\n};`;
        }
        return `const ${k} = ${typeof S[k] === 'string' ? `'${S[k]}'` : S[k]};`;
      });
      out(lines.length ? lines.join('\n') : '// Nothing changed from the file values.');
    }));
    io.append(btn('Export', () => {
      const snap = {}; for (const k of Object.keys(FILE_SETTINGS)) snap[k] = S[k];
      const text = JSON.stringify({ cozyBeachSettings: 1, settings: snap }, null, 1);
      out(text);
      try { const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: 'cozy-beach-settings.json' }); document.body.append(a); a.click(); a.remove(); } catch {}
    }));
    io.append(btn('Import pasted', () => {
      try { const j = JSON.parse(box.value); const n = applySettings(j.settings || j); box.value = `Imported: ${n} setting(s) changed.`; } catch { box.value = "That doesn't look like exported settings (JSON)."; }
      setTimeout(build, 900);
    }));
    const file = el('input', { type: 'file', accept: '.json,application/json', hidden: true });
    file.onchange = () => { const f = file.files[0]; if (!f) return; f.text().then((t) => { box.value = t; try { const j = JSON.parse(t); applySettings(j.settings || j); } catch {} build(); }); };
    io.append(btn('Import file…', () => file.click()), file);
    panel.append(io, box);
  }

  // Colours tab: pick a character, then hue / saturation / lightness for each of its three parts.
  function buildColours() {
    const pick = el('div', { className: 'seg' });
    for (const d of CHAR_DEFS) pick.append(chip(d.name, d.name === who, () => { who = d.name; store('beachPanelWho', who); build(); }));
    const def = CHAR_DEFS.find((d) => d.name === who);
    panel.append(el('p', { className: 'hint', textContent: `${def.name} (${def.about}). Changes show straight away.` }), pick);
    const char = characters.find((c) => c.def.name === who);
    const cols = S.CHARACTER_COLORS[who];
    const PART_LABEL = { legs: def.feet === 'legs' ? 'Legs, belly and feet' : 'Legs and belly', body: def.feet === 'body' ? 'Chest, arms, hands and feet' : 'Chest, arms and hands', head: 'Head and snout' };
    for (const part of COLOR_PARTS) {
      const swatch = el('span', { className: 'swatch' });
      panel.append(el('div', { className: 'part' }, swatch, el('h3', { textContent: PART_LABEL[part] })));
      const rows = [['Hue', 360], ['Saturation', 100], ['Lightness', 100]].map(([name, max], j) => {
        const val = el('span', { className: 'val' });
        const rg = el('input', { type: 'range', min: 0, max, step: 1, value: cols[part][j], ariaLabel: `${PART_LABEL[part]} ${name.toLowerCase()}` });
        panel.append(el('div', { className: 'row hsl' }, el('label', { textContent: name }), val, rg));
        return { rg, val, j };
      });
      const refresh = () => {
        const [h, s, l] = cols[part];
        swatch.style.background = `hsl(${h}, ${s}%, ${l}%)`;
        rows[0].rg.style.setProperty('--g', `linear-gradient(to right, ${[0, 60, 120, 180, 240, 300, 360].map((x) => `hsl(${x}, ${s}%, ${l}%)`).join(', ')})`);
        rows[1].rg.style.setProperty('--g', `linear-gradient(to right, hsl(${h}, 0%, ${l}%), hsl(${h}, 100%, ${l}%))`);
        rows[2].rg.style.setProperty('--g', `linear-gradient(to right, hsl(${h}, ${s}%, 0%), hsl(${h}, ${s}%, 50%), hsl(${h}, ${s}%, 100%))`);
        for (const r of rows) r.val.textContent = String(cols[part][r.j]) + (r.j ? '%' : '°');
      };
      for (const r of rows) r.rg.oninput = () => { cols[part][r.j] = +r.rg.value; refresh(); if (char) paintCharacter(char); saveSettings(); };
      refresh();
    }
    panel.append(el('div', { className: 'actions' }, btn(`Reset ${who}'s colours`, () => { S.CHARACTER_COLORS[who] = JSON.parse(JSON.stringify(FILE_SETTINGS.CHARACTER_COLORS[who])); if (char) paintCharacter(char); saveSettings(); build(); })));
    if (!char) panel.append(el('p', { className: 'hint', textContent: `${who} is hidden (Scene → Number of characters). The colours are saved for when they come back.` }));
  }

  // Drag the panel background to scroll it (for when the mouse wheel doesn't reach the wallpaper)
  let drag = null;
  panel.addEventListener('pointerdown', (e) => {
    if (e.target.closest('input, button, select, textarea, label') || panel.scrollHeight <= panel.clientHeight) return;
    drag = { y: e.clientY, top: panel.scrollTop, id: e.pointerId };
    panel.classList.add('dragging');
    try { panel.setPointerCapture(e.pointerId); } catch {}
  });
  panel.addEventListener('pointermove', (e) => { if (drag && e.pointerId === drag.id) panel.scrollTop = drag.top - (e.clientY - drag.y); });
  const endDrag = () => { drag = null; panel.classList.remove('dragging'); };
  panel.addEventListener('pointerup', endDrag);
  panel.addEventListener('pointercancel', endDrag);
  if (Q.has('settings')) {   // ?settings opens the panel straight away (?settings=Colours opens that tab)
    const t = TABS.find((x) => x.toLowerCase() === (Q.get('settings') || '').toLowerCase()); if (t) tab = t;
    panel.hidden = false; build();
  }
})();

// First frame: settle everything so there is no pop-in
scene.updateMatrixWorld(true);
updateEnvironment(0, 0);
updateCharacters(0.016, 0);
scene.updateMatrixWorld(true);
if (!document.hidden) start();
// Test hook (used for automated checks; harmless otherwise)
window.__beach = {
  THREE, scene, camera, renderer, characters, env, CFG, S, roast, sign, music, wx, weatherStatus, fireBurst, applySettings, GFX,
  step(dt = 1 / 30, render = true) { simTime += dt; updateEnvironment(simTime, dt); updateCharacters(dt, simTime); if (render) post.render(); },
  get time() { return simTime; },
  sleep(i, secs = 60) { const c = characters[i]; c.st.dozing = true; c.st.dozeEnd = simTime + secs; },
};
// test: ?warmup=10 fast-forwards 10 simulated seconds before the first frame
if (Q.has('warmup')) for (let i = 0, n = qnum('warmup', 5) * 30; i < n; i++) window.__beach.step(1 / 30, false);
// test: ?stop=N makes the music stop after N seconds (to watch the sign come down)
</script>
</body>
</html>
